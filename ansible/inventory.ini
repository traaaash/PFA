[pfa_server]
# This will be replaced by Terraform output (EC2 public IP)
# Example: 54.123.45.67 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/pfa-key.pem
pfa ansible_host=REPLACE_WITH_EC2_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/pfa-key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'
