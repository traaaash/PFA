---
# ─── OPENLDAP BOOTSTRAP LDIF ──────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-bootstrap
data:
  bootstrap.ldif: |
    dn: ou=users,dc=sotupa,dc=local
    objectClass: organizationalUnit
    ou: users

    dn: cn=alice,ou=users,dc=sotupa,dc=local
    objectClass: inetOrgPerson
    cn: alice
    sn: Alice
    uid: alice
    userPassword: alice123
    mail: alice@sotupa.local

    dn: cn=bob,ou=users,dc=sotupa,dc=local
    objectClass: inetOrgPerson
    cn: bob
    sn: Bob
    uid: bob
    userPassword: bob123
    mail: bob@sotupa.local

    dn: cn=charlie,ou=users,dc=sotupa,dc=local
    objectClass: inetOrgPerson
    cn: charlie
    sn: Charlie
    uid: charlie
    userPassword: charlie123
    mail: charlie@sotupa.local

---
# ─── OPENLDAP DEPLOYMENT ──────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      containers:
        - name: openldap
          image: bitnami/openldap:latest
          ports:
            - containerPort: 1389
          env:
            - name: LDAP_ADMIN_USERNAME
              value: "admin"
            - name: LDAP_ADMIN_PASSWORD
              value: "admin123"
            - name: LDAP_ROOT
              value: "dc=sotupa,dc=local"
            - name: LDAP_ADMIN_DN
              value: "cn=admin,dc=sotupa,dc=local"
            - name: LDAP_CUSTOM_LDIF_DIR
              value: "/ldifs"
          volumeMounts:
            - name: bootstrap
              mountPath: /ldifs
      volumes:
        - name: bootstrap
          configMap:
            name: openldap-bootstrap

---
apiVersion: v1
kind: Service
metadata:
  name: openldap-service
spec:
  selector:
    app: openldap
  ports:
    - port: 389
      targetPort: 1389
