---
# ─── OPENLDAP BOOTSTRAP LDIF ──────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-bootstrap
data:
  01-users.ldif: |
    dn: ou=users,dc=sotupa,dc=local
    objectClass: organizationalUnit
    ou: users

    dn: cn=alice,ou=users,dc=sotupa,dc=local
    objectClass: inetOrgPerson
    cn: alice
    sn: Alice
    uid: alice
    userPassword: alice123
    mail: alice@sotupa.local

    dn: cn=bob,ou=users,dc=sotupa,dc=local
    objectClass: inetOrgPerson
    cn: bob
    sn: Bob
    uid: bob
    userPassword: bob123
    mail: bob@sotupa.local

    dn: cn=charlie,ou=users,dc=sotupa,dc=local
    objectClass: inetOrgPerson
    cn: charlie
    sn: Charlie
    uid: charlie
    userPassword: charlie123
    mail: charlie@sotupa.local

---
# ─── OPENLDAP DEPLOYMENT ──────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      containers:
        - name: openldap
          image: osixia/openldap:1.5.0
          ports:
            - containerPort: 389
          env:
            - name: LDAP_ORGANISATION
              value: "Sotupa"
            - name: LDAP_DOMAIN
              value: "sotupa.local"
            - name: LDAP_ADMIN_PASSWORD
              value: "admin123"
            - name: LDAP_SEED_INTERNAL_LDIF_PATH
              value: "/container/service/slapd/assets/config/bootstrap/ldif/custom"
          volumeMounts:
            - name: bootstrap
              mountPath: /container/service/slapd/assets/config/bootstrap/ldif/custom
          args: ["--copy-service"]
      volumes:
        - name: bootstrap
          configMap:
            name: openldap-bootstrap

---
apiVersion: v1
kind: Service
metadata:
  name: openldap-service
spec:
  selector:
    app: openldap
  ports:
    - port: 389
      targetPort: 389
