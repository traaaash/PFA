---
# ─── OPENLDAP DEPLOYMENT ──────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      containers:
        - name: openldap
          image: osixia/openldap:1.5.0
          ports:
            - containerPort: 389
          env:
            - name: LDAP_ORGANISATION
              value: "Sotupa"
            - name: LDAP_DOMAIN
              value: "sotupa.local"
            - name: LDAP_ADMIN_PASSWORD
              value: "admin123"
            - name: LDAP_REMOVE_CONFIG_AFTER_SETUP
              value: "false"
          args: ["--copy-service", "--loglevel", "warning"]

---
apiVersion: v1
kind: Service
metadata:
  name: openldap-service
spec:
  selector:
    app: openldap
  ports:
    - port: 389
      targetPort: 389
