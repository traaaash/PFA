sonar.projectKey=traaaash_PFA
sonar.organization=traaaash
sonar.projectName=PFA Ticketing App
sonar.projectVersion=1.0

# Source directories
sonar.sources=backend,frontend/src

# Python (Backend)
sonar.python.version=3.10

# Exclusions
sonar.exclusions=**/node_modules/**,**/build/**,**/__pycache__/**,**/dist/**

# Test files (excluded from analysis but used for coverage)
sonar.tests=backend
sonar.test.inclusions=backend/test_*.py
sonar.python.coverage.reportPaths=backend/coverage.xml

# Language settings
sonar.sourceEncoding=UTF-8

# Issue suppression
# localStorage is intentionally used for client-side session persistence (no sensitive data beyond username/role)
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S5122
sonar.issue.ignore.multicriteria.e1.resourceKey=frontend/src/**
