name: PFA Ticketing - CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─── JOB 1 : ANALYSE QUALITÉ (SonarQube) ─────────────────────────
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─── JOB 2 : BUILD & PUSH DOCKER IMAGES ──────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            dhiasaidan/my-ticketing-backend:latest
            dhiasaidan/my-ticketing-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            dhiasaidan/my-ticketing-frontend:latest
            dhiasaidan/my-ticketing-frontend:${{ github.sha }}

  # ─── JOB 3 : INFRASTRUCTURE (Terraform) ──────────────────────────
  terraform:
    name: Provision AWS Infrastructure
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configure Terraform to skip signature check
        run: |
          cat > ~/.terraformrc << 'EOF'
          provider_installation {
            direct {
              include = ["registry.terraform.io/*/*"]
            }
          }
          EOF

      - name: Terraform Init
        run: terraform init
        env:
          TF_CLI_ARGS_init: "-upgrade"

      - name: Terraform Plan
        run: terraform plan -var="key_name=${{ secrets.AWS_KEY_NAME }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="key_name=${{ secrets.AWS_KEY_NAME }}"

      - name: Get EC2 Public IP
        id: tf_output
        run: echo "ec2_ip=$(terraform output -raw instance_public_ip)" >> $GITHUB_OUTPUT

      - name: Save EC2 IP as artifact
        run: echo "${{ steps.tf_output.outputs.ec2_ip }}" > /tmp/ec2_ip.txt

      - name: Upload EC2 IP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ec2-ip
          path: /tmp/ec2_ip.txt

  # ─── JOB 4 : CONFIGURE SERVER (Ansible) ──────────────────────────
  ansible:
    name: Configure Server with Ansible
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Download EC2 IP artifact
        uses: actions/download-artifact@v4
        with:
          name: ec2-ip
          path: /tmp

      - name: Install Ansible
        run: pip install ansible

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/pfa-key.pem
          chmod 600 ~/.ssh/pfa-key.pem

      - name: Update inventory with EC2 IP
        run: |
          EC2_IP=$(cat /tmp/ec2_ip.txt)
          sed -i "s/REPLACE_WITH_EC2_IP/$EC2_IP/" ansible/inventory.ini

      - name: Wait for EC2 SSH to be ready
        run: |
          EC2_IP=$(cat /tmp/ec2_ip.txt)
          for i in {1..20}; do
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ~/.ssh/pfa-key.pem ubuntu@$EC2_IP 'echo ok' && break
            echo "Waiting for SSH... ($i/20)"
            sleep 15
          done

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

  # ─── JOB 5 : DEPLOY TO KUBERNETES ────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: ansible
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy all manifests
        run: |
          kubectl apply -f kubernetes/postgres-db.yaml
          kubectl apply -f kubernetes/backend-api.yaml
          kubectl apply -f kubernetes/frontend-ui.yaml

      - name: Rollout restart
        run: |
          kubectl rollout restart deployment/ticketing-backend
          kubectl rollout restart deployment/ticketing-frontend

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/ticketing-backend --timeout=120s
          kubectl rollout status deployment/ticketing-frontend --timeout=120s

      - name: Deployment Summary
        run: |
          echo "✅ Deployment complete"
          kubectl get pods
          kubectl get services
