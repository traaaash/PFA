name: Ticketing App CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Build Backend Image
      run: docker build -t my-ticketing-backend ./backend

    - name: Build Frontend Image
      run: docker build -t my-ticketing-frontend ./frontend

    # Future steps: Add SonarQube analysis, push to DockerHub, and deploy to K8s